organization: chicago
module: minesweeper
description: Minesweeper for the Chicago desktop — three levels, flags and a flag mode, chording, the smiley and the timer; the rules are a pure library, the window a declarative SDK application.
license: MIT
repository: https://github.com/chicago-desktop/minesweeper
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - game
  - minesweeper
  - chicago
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# The image pack is packed only when named here (fs.directory -> fs.embed).
embed:
  - chicago.minesweeper:images
