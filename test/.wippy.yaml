version: "1.0"
# The harness boots the module under test from `..` and the shell and its
# base from the neighbouring working copies (neither is in the Hub yet);
# suites run with `wippy test`.
workspace:
  replacements:
    windows/minesweeper: ..
    windows/shell: ../../windows-module
    windows/tui-desktop: ../../kickside-module
override:
  "windows.tui_desktop:exec:default_env.HOME": "${env:HOME}"
  "windows.tui_desktop:exec:default_env.PATH": "${env:PATH}"
  # The shell and its base ask the application for the user group; the
  # harness's permissive scope stands in.
  "windows.shell.security:user_security_scope:data.default": app:user
  "windows.tui_desktop.security:user_security_scope:data.default": app:user
