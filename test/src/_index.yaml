version: "1.0"
namespace: app

# Standalone harness for windows/minesweeper. Provides the host
# resources the boot needs (app:db, app:processes, a gateway and a router for
# the shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Minesweeper Test Harness}

  - name: game_test
    kind: function.lua
    meta:
      type: test
      comment: "Minesweeper's rules on fixed seeds and planted boards — the first click's safe zone and replay, a new board keeping the generator and Flag mode, flood opening, loss and win, chording, flags and Flag mode, the timer, the levels, the counter, the face and the status."
      group: Minesweeper
      suite: windows_minesweeper
    source: file://game_test.lua
    method: run
    imports:
      test: wippy.test:test
      game: windows.minesweeper:game

  - name: view_test
    kind: function.lua
    meta:
      type: test
      comment: "Minesweeper's view — the level from the argument, the field of buttons with numbers in colour, the counters and the face, the right button and Flag mode, a lost and a won field, the menu and About, the clock, the layout of every level in cells and pixels, and test/shots/minesweeper.png."
      group: Minesweeper
      suite: windows_minesweeper
    source: file://view_test.lua
    method: run
    modules: [tty, gfx, fs]
    imports:
      test: wippy.test:test
      ui: windows.shell.sdk:ui
      app: windows.shell.sdk:app
      render: windows.shell.sdk:render
      rasters: windows.shell.theme:rasters
      game: windows.minesweeper:game
      view: windows.minesweeper:view

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "Minesweeper's window process — the registry entry in Programs/Games, the pack's pictures found by the shell, and the process running the view with a seed and the fit timer."
      group: Minesweeper
      suite: windows_minesweeper
    source: file://window_test.lua
    method: run
    modules: [time, gfx, fs, registry]
    imports:
      test: wippy.test:test
      app: windows.shell.sdk:app
      images: windows.shell.theme:images
      view: windows.minesweeper:view
      window: windows.minesweeper:window

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the game does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229, so both harnesses
  # can run side by side.
  - name: gateway
    kind: http.service
    addr: :19249
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: minesweeper_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "windows/minesweeper"

  - name: minesweeper_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: minesweeper_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: minesweeper_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
