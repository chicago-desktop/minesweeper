# Neither the shell nor its base is in the Hub yet, so both come from the
# neighbouring working copies. Remove each line once that module is
# published, and resolve it by the version in wippy.lock instead — otherwise
# this module builds only on a machine that has those directories beside it.
workspace:
  replacements:
    butschster/windows: ../windows-module
    butschster/tui-desktop: ../kickside-module
